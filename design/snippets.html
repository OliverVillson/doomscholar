<!-- Snippets for the feature threads. -->

<!-- 1. Read button, appended to .card__actions after the heart button -->
<button class="btn btn--primary card__read" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/></svg>Read paper</button>

<!-- 2. Bottom tab bar -->
<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" aria-selected="true" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    Feed
  </button>
  <button class="tab tab--liked" role="tab" aria-selected="false" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.7 1.1 5 2.9 1.3-1.8 3-2.9 5-2.9 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
    Liked
  </button>
</nav>

<!-- 3. Liked view container -->
<section class="page" hidden><div class="liked-list"></div></section>

<!-- 4. Toast -->
<div class="toast" role="status">Saved to Liked</div>
